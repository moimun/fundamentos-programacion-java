
site_name: Fundamentos de Programación en Java
site_description: Documentación de los fundamentos de programación utilizando Java
site_author: Eme

theme:
  name: material
  language: es

  icon:
    logo: material/language-java

  features:
    - navigation.top
    - toc.follow

  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro



markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true



nav:
  - Inicio: index.md

  - Tema 01. Introducción a la programación:
      - Introducción: tema01/index.md
      - ¿Qué es la programación?: tema01/introduccion.md
      - Manipulación de datos: tema01/manipulacion-datos.md

  - Tema 02. Programación estructurada:
      - Introducción: tema02/index.md
      - Algoritmos: tema02/algoritmos.md
      - Estructuras de selección: tema02/estructuras-seleccion.md
      - Estructuras de repetición: tema02/estructuras-repeticion.md

  - Tema 03. Arrays y cadenas:
      - Introducción: tema03/index.md
      - Arrays: tema03/arrays.md

  - Ejemplos de Java:
      - Índice: ejemplos/index.md
      - Fundamentos de Java: ejemplos/fundamentos-java.md
      - Estructuras de control: ejemplos/estructuras-control.md
      - Arrays: ejemplos/arrays.md
